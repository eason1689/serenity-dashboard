name: Hynix 07709 monitor watchdog

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes during the broad Hong Kong trading window.
    # The script itself stays quiet outside continuous trading sessions.
    - cron: "11,26,41,56 1-7 * * 1-5"

permissions:
  actions: read
  contents: write

concurrency:
  group: hynix-07709-state
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check monitor freshness
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: npm run watchdog:hynix

      - name: Commit watchdog state
        run: |
          if git diff --quiet -- hynix-watchdog-state.json; then
            echo "No watchdog state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hynix-watchdog-state.json
          git commit -m "Update Hynix watchdog state"
          git push
