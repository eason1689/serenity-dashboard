name: Hynix 07709 deviation monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the monitor or send a Pushplus smoke test
        required: false
        default: monitor
        type: choice
        options:
          - monitor
          - test_push
  schedule:
    # Every 5 minutes during the broad Hong Kong trading-day window.
    # The script itself skips holidays, lunch break, half-day/halts, and non-trading time.
    # Use multiple off-peak minutes to reduce missed scheduled runs.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 1-9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: hynix-07709-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Monitor 07709 deviation
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'test_push'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: npm run monitor:hynix

      - name: Test Pushplus delivery
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test_push'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: npm run test-push:hynix

      - name: Commit monitor state
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'test_push'
        run: |
          if git diff --quiet -- hynix-monitor-state.json; then
            echo "No monitor state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hynix-monitor-state.json
          git commit -m "Update Hynix monitor state"
          git push
